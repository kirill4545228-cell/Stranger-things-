name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unpack zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "No zip in repo root"; exit 1; fi
          rm -rf _project && mkdir _project
          unzip -q -o "$ZIP" -d _project
          GRADLE_FILE=$(find _project -name build.gradle | head -n 1)
          echo "PROJECT_DIR=$(dirname "$GRADLE_FILE")" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
